# CD GitHub Actions workflow for monolith

name: CD

on:
  release:
    types:
    - created

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.release.tag_name }}

jobs:

  linux_cli_aarch64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Prepare cross-platform environment
      run: |
        sudo mkdir /cross-build
        sudo touch /etc/apt/sources.list.d/arm64.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main" | sudo tee -a /etc/apt/sources.list.d/arm64.list
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross libc6-dev-arm64-cross
        rustup target add aarch64-unknown-linux-gnu
        echo "C_INCLUDE_PATH=/cross-build/usr/include" >> $GITHUB_ENV
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        echo "RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc -L/usr/aarch64-linux-gnu/lib -L/cross-build/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV

    - name: Build the executable
      run: cargo build --release --target=aarch64-unknown-linux-gnu --no-default-features --features cli

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/aarch64-unknown-linux-gnu/release/monolith monolith-cli-linux-aarch64
        gh release upload "$TAG" monolith-cli-linux-aarch64 --clobber

  linux_cli_armhf:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Prepare cross-platform environment
      run: |
        sudo mkdir /cross-build
        sudo touch /etc/apt/sources.list.d/armhf.list
        echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal main" | sudo tee -a /etc/apt/sources.list.d/armhf.list
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-armhf-cross libc6-dev-armhf-cross
        rustup target add arm-unknown-linux-gnueabihf
        echo "C_INCLUDE_PATH=/cross-build/usr/include" >> $GITHUB_ENV
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        echo "RUSTFLAGS=-C linker=arm-linux-gnueabihf-gcc -L/usr/arm-linux-gnueabihf/lib -L/cross-build/usr/lib/arm-linux-gnueabihf -L/cross-build/lib/arm-linux-gnueabihf" >> $GITHUB_ENV

    - name: Build the executable
      run: cargo build --release --target=arm-unknown-linux-gnueabihf --no-default-features --features cli

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/arm-unknown-linux-gnueabihf/release/monolith monolith-cli-linux-armhf
        gh release upload "$TAG" monolith-cli-linux-armhf --clobber

  linux_cli_x86_64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Build the executable
      run: cargo build --release --features cli

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/release/monolith monolith-cli-linux-x86_64
        gh release upload "$TAG" monolith-cli-linux-x86_64 --clobber

  linux_gui_appimage:
    strategy:
      matrix:
        include:
        - arch: x86_64
          deb_arch: amd64
          apt_mirror: http://archive.ubuntu.com/ubuntu/
          runner: ubuntu-22.04
        - arch: aarch64
          deb_arch: arm64
          apt_mirror: http://ports.ubuntu.com/ubuntu-ports/
          runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-setuptools patchelf desktop-file-utils \
          libgdk-pixbuf2.0-dev fakeroot strace squashfs-tools zsync \
          libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
          libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev pkg-config

    - name: Install appimage-builder and appimagetool
      run: |
        sudo pip3 install appimage-builder
        sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage -O /usr/local/bin/appimagetool
        sudo chmod +x /usr/local/bin/appimagetool

    - name: Build the GUI executable
      run: cargo build --locked --release --bin monolith-gui --features="gui"

    - name: Sync version and architecture
      run: |
        VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
        sed -i "s/^    version: .*/    version: ${VERSION}/" AppImageBuilder.yml
        sed -i "s/^    arch: .*/    arch: ${{ matrix.deb_arch }}/" AppImageBuilder.yml
        sed -i "s/^  arch: .*/  arch: ${{ matrix.arch }}/" AppImageBuilder.yml
        sed -i "s|deb http://archive.ubuntu.com/ubuntu/ |deb ${{ matrix.apt_mirror }} |" AppImageBuilder.yml

    - name: Copy files into AppDir
      run: |
        mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/128x128/apps
        cp target/release/monolith-gui AppDir/usr/bin/monolith-gui
        cp assets/icon/icon-128.png AppDir/usr/share/icons/hicolor/128x128/apps/monolith.png

    - name: Build the AppImage
      run: appimage-builder --recipe AppImageBuilder.yml --skip-test

    - name: Attach artifact to the release
      shell: bash
      run: |
        mv monolith-*-${{ matrix.arch }}.AppImage Monolith-${{ matrix.arch }}.AppImage \
          || mv *.AppImage Monolith-${{ matrix.arch }}.AppImage
        gh release upload "$TAG" Monolith-${{ matrix.arch }}.AppImage --clobber

  macos_cli:
    runs-on: macos-latest

    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Install Rust target
      run: rustup target add ${{ matrix.target }}

    - name: Build the executable
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      run: cargo build --release --features cli --target ${{ matrix.target }}

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/monolith monolith-cli-macos-${{ matrix.target }}
        gh release upload "$TAG" monolith-cli-macos-${{ matrix.target }} --clobber

  macos_gui:
    runs-on: macos-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Install Rust targets
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

    - name: Build the GUI executable for both architectures and join them
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      run: |
        cargo build --locked --release --bin monolith-gui --features="gui" --target aarch64-apple-darwin
        cargo build --locked --release --bin monolith-gui --features="gui" --target x86_64-apple-darwin
        mkdir -p target/universal
        lipo -create -output target/universal/monolith-gui \
          target/aarch64-apple-darwin/release/monolith-gui \
          target/x86_64-apple-darwin/release/monolith-gui

    - name: Bundle Monolith.app
      run: BIN=target/universal/monolith-gui sh dist/macos-app.sh

    - name: Attach artifact to the release
      shell: bash
      run: gh release upload "$TAG" target/Monolith-macos.zip --clobber

  windows_cli:
    runs-on: windows-2022

    steps:
    - run: git config --global core.autocrlf false

    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Build the executable
      run: cargo build --release --features cli

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/release/monolith.exe monolith-cli.exe
        gh release upload "$TAG" monolith-cli.exe --clobber

  windows_gui:
    runs-on: windows-2022

    steps:
    - run: git config --global core.autocrlf false

    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Build the GUI executable
      run: cargo build --locked --release --bin monolith-gui --features="gui"

    - name: Attach artifact to the release
      shell: bash
      run: |
        cp target/release/monolith-gui.exe Monolith.exe
        gh release upload "$TAG" Monolith.exe --clobber
