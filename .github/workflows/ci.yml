# CI GitHub Actions workflow for monolith

name: CI

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
    - 'assets/'
    - 'dist/'
    - 'snap/'
    - 'Dockerfile'
    - 'LICENSE'
    - 'Makefile'
    - 'monolith.nuspec'
    - 'README.md'

jobs:
  build_and_test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - run: git config --global core.autocrlf false

    - name: "Checkout repository"
      uses: actions/checkout@v4

    - name: Build
      run: cargo build --all --locked --verbose

    # Ubuntu restricts what Chromium's sandbox relies on, unless it's installed from a package
    - name: Let browsers use their sandbox
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run tests
      run: cargo test --all --locked --verbose --no-fail-fast
      env:
        MONOLITH_TEST_REQUIRE_BROWSERS: 1
        MONOLITH_TEST_BROWSERS: ${{ runner.os == 'Windows' && 'C:\Program Files\Mozilla Firefox\firefox.exe;C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' || '' }}

    # Browsers are a feature, builds without it have to keep working
    - name: Run tests without browser support
      run: cargo test --locked --verbose --no-default-features --features cli --test mod

    - name: Check code formatting
      run: |
        rustup component add rustfmt
        cargo fmt --all -- --check
