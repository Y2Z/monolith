version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: y2z.monolith
    name: monolith
    icon: monolith
    version: 2.11.2
    exec: usr/bin/monolith-gui
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://archive.ubuntu.com/ubuntu/ jammy main universe multiverse"
    include:
      - libglib2.0-0
      - libgtk-3-0
      - libdbus-1-3
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libxcb1
      - libxkbcommon0
      - libasound2
      - libpangocairo-1.0-0
      - libpango-1.0-0
      - libcairo2
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libgdk-pixbuf-2.0-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libssl3
      - ca-certificates

  files:
    include:
      - target/release/monolith-gui: usr/bin/monolith-gui
      - assets/icon/icon-128.png: usr/share/icons/hicolor/128x128/apps/monolith.png

AppImage:
  arch: x86_64
  sign-key: null
  update-information: null
