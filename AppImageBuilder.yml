version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: y2z.monolith
    name: monolith
    icon: monolith
    version: 2.11.2
    exec: usr/bin/monolith-gui
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://archive.ubuntu.com/ubuntu/ noble main universe multiverse"
    include:
      - libglib2.0-0
      - libgtk-3-0
      - libdbus-1-3
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libxcb1
      - libxkbcommon0
      - libasound2
      - libpangocairo-1.0-0
      - libpango-1.0-0
      - libcairo2
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libgdk-pixbuf-2.0-0
      - libgtk-3-dev
      - pkg-config
      - libssl3
      - ca-certificates
      - make
      - cargo
      - rustc

  files:
    include:
      - target/release/monolith-gui: usr/bin/monolith-gui
      - assets/icon/icon-128.png: usr/share/icons/hicolor/128x128/apps/monolith.png

AppImage:
  arch: x86_64
  sign-key: null
  update-information: null

script: |
  set -euo pipefail

  cargo build --locked --release --bin monolith-gui --features="gui"

  mkdir -p "${APPDIR}/usr/bin"
  mkdir -p "${APPDIR}/usr/share/icons/hicolor/128x128/apps"

  install -Dm755 "target/release/monolith-gui" "${APPDIR}/usr/bin/monolith-gui"
  install -Dm644 "assets/icon/icon-128.png" "${APPDIR}/usr/share/icons/hicolor/128x128/apps/monolith.png"
